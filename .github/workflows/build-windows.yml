name: Build Windows
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Salin tampilan web ke aplikasi desktop
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force app | Out-Null
          Copy-Item ../index.html, ../manifest.webmanifest, ../sw.js, ../icon-192.png, ../icon-512.png app/
          Copy-Item -Recurse -Force ../vendor app/
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: KLM-Sender-Windows
          path: desktop/dist/*.exe
